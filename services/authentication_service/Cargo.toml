[package]
default-run = "authentication_service"
edition = "2024"
name = "authentication_service"
publish = false
version = "0.1.0"

[[bin]]
name = "authentication_service"
path = "src/main.rs"

[[bin]]
name = "generate_keys"
path = "src/bin/generate_keys.rs"

[[bin]]
name = "authentication_service_openapi"
path = "src/openapi.rs"
required-features = ["full-saas"]

[[bin]]
name = "authentication_service_doppler_config"
path = "src/doppler_config.rs"

[features]
default = ["full-saas", "rate_limit"]
full-saas = [
  "dep:analytics_client",
  "dep:async-stripe",
  "dep:async-stripe-webhook",
  "dep:aws-sdk-kms",
  "dep:calendar_events",
  "dep:channels",
  "dep:comms_db_client",
  "dep:connection_gateway_client",
  "dep:contacts",
  "dep:cursor_api_key",
  "dep:cursor_cloud_agents",
  "dep:document_storage_service_client",
  "dep:favorites",
  "dep:foreign_entity",
  "dep:github",
  "dep:loops_client",
  "dep:macro_event_broker",
  "dep:microsoft_oauth_grant_db_utils",
  "dep:mobile_welcome_email_db_client",
  "dep:native_app_service",
  "dep:notification",
  "dep:referral",
  "dep:roles_and_permissions",
  "dep:ses_client",
  "dep:teams",
  "dep:user_quota",
  "macro_cache_client/mobile_welcome_email_rate_limit",
  "macro_db_client/team",
  "sqs_client/search",
]
local = []
rate_limit = []
return_passwordless_code = []
self-host-email = ["rate_limit"]

[dependencies]
cursor_api_key = { path = "../../crates/cursor_api_key", optional = true }
cursor_cloud_agents = { path = "../../crates/cursor_cloud_agents", optional = true }
aes-gcm = { workspace = true }
calendar_events = { path = "../../crates/calendar_events", optional = true }
analytics_client = { path = "../../crates/analytics_client", optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
async-stripe = { workspace = true, default-features = false, features = [
  "billing",
  "checkout",
  "runtime-tokio-hyper-rustls-webpki",
], optional = true }
async-stripe-webhook = { version = "1.0.0-alpha.4", default-features = false, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true, features = ["macros"] }
base64 = { workspace = true }
channels = { path = "../../crates/channels", default-features = false, features = [
  "outbound",
], optional = true }
chrono = { workspace = true }
comms_db_client = { path = "../../crates/comms_db_client", optional = true }
connection_gateway_client = { path = "../../crates/connection_gateway_client", optional = true }
contacts = { path = "../../crates/contacts", default-features = false, features = [
  "outbound",
], optional = true }
cookie = { workspace = true }
decode_jwt = { path = "../../crates/decode_jwt" }
document_storage_service_client = { path = "../../crates/document_storage_service_client", optional = true }
email = { path = "../../crates/email", default-features = false, features = ["http_client"] }
doppleganger = { workspace = true }
email_db_client = { path = "../../crates/email_db_client" }
email_validator = { path = "../../crates/email_validator" }
entity_access = { path = "../../crates/entity_access" }
foreign_entity = { path = "../../crates/foreign_entity", optional = true }
favorites = { path = "../../crates/favorites", features = ["postgres"], optional = true }
fusionauth = { path = "../../crates/fusionauth" }
futures = { workspace = true }
github = { path = "../../crates/github", default-features = false, features = [
  "axum",
  "inbound",
  "link",
  "outbound",
], optional = true }
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true }
last_online_tracker = { path = "../../crates/last_online_tracker" }
loops_client = { path = "../../crates/loops_client", optional = true }
macro_auth = { path = "../../crates/macro_auth" }
macro_authorization = { path = "../../crates/macro_authorization", features = [
  "postgres",
] }
macro_aws_config = { path = "../../crates/macro_aws_config" }
macro_cache_client = { path = "../../crates/macro_cache_client", default-features = false, features = [
  "auth",
  "auth_rate_limit",
  "login_code_rate_limit",
  "verify_email_rate_limit",
] }
macro_cors = { path = "../../crates/macro_cors" }
macro_config = { path = "../../crates/macro_config" }
macro_db_client = { path = "../../crates/macro_db_client", default-features = false, features = [
  "account_merge_request",
  "team",
] }
macro_entrypoint = { path = "../../crates/macro_entrypoint" }
macro_env = { path = "../../crates/macro_env" }
macro_event_broker = { path = "../../crates/macro_event_broker", optional = true }
macro_env_var = { path = "../../crates/macro_env_var" }
macro_queues = { path = "../../crates/macro_queues" }
macro_middleware = { path = "../../crates/macro_middleware", default-features = false, features = [
  "tracking",
] }
mention_utils = { path = "../../crates/mention_utils" }
macro_service_urls = { path = "../../crates/macro_service_urls" }
macro_tower_layers = { path = "../../crates/macro_tower_layers" }
macro_user_id = { path = "../../crates/macro_user_id" }
macro_uuid = { path = "../../crates/macro_uuid" }
maud = { version = "0.27.0" }
miniserde = "0.1.45"
microsoft_oauth_grant_db_utils = { path = "../../crates/microsoft_oauth_grant_db_utils", optional = true }
mobile_welcome_email_db_client = { path = "../../crates/mobile_welcome_email_db_client", optional = true }
mockall = { workspace = true }
model = { path = "../../crates/model" }
model-entity = { path = "../../crates/model-entity" }
models_permissions = { path = "../../crates/models_permissions" }
native_app_service = { path = "../../crates/native_app_service", optional = true }
non_empty = { path = "../../crates/non_empty" }
notification = { path = "../../crates/notification", optional = true }
rand = { workspace = true }
rate_limit = { path = "../../crates/rate_limit" }
redis = { workspace = true }
referral = { path = "../../crates/referral", optional = true }
remote_env_var = { path = "../../crates/remote_env_var" }
reqwest = { workspace = true }
roles_and_permissions = { path = "../../crates/roles_and_permissions", optional = true }
rootcause = { workspace = true }
rsa = { version = "0.9.10", features = ["getrandom"] }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_utils = { path = "../../crates/serde_utils", features = ["urlencode"] }
ses_client = { path = "../../crates/ses_client", optional = true }
sha1 = "0.10.6"
sqlx = { workspace = true }
sqs_client = { path = "../../crates/sqs_client", default-features = false, features = [
  "email",
] }
strum = { workspace = true }
teams = { path = "../../crates/teams", optional = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true }
tower-cookies = { version = "0.11.0" }
tower-http = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
user_quota = { path = "../../crates/user_quota", optional = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
doppler-config = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
database_env_vars = { path = "../../crates/database_env_vars" }

[dev-dependencies]
cool_asserts = "2"

[package.metadata.cargo-machete]
ignored = ["async-stripe"]
