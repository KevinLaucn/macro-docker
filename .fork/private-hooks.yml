    marker: "// PRIVATE-HOOK: crm_backfill:populate_all_inboxes"
    expected: "let links = email_db_client::links::get::fetch_inboxes_for_macro_id(&ctx.db, macro_id_str)"
    context:
      - "for link in links {"
