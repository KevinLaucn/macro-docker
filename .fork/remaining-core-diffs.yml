  required_for: In official AWS, services/search_upload_handler forwards S3/EventBridge
    document upload events to DSS, which emits DocumentTopicEvent::ContentUploaded
    to drive Search Processor. Self-host uses LocalStack without AWS EventBridge/Lambda
    pipelines; packages/fork/search-upload-worker and self-host infrastructure replicate
