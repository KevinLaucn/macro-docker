version: 1

# Keep the private fast recommendation model replacement mechanical and
# independently checkable across upstream merges.
overrides:
  - id: home_recommendations_fast_model_import
    file: apps/web/src/lib/queries/ai/createHomeRecommendations.ts
    search: "import { FREE_DEFAULT_MODEL } from '@core/component/AI/constant';"
    replace: "import { Model } from '@core/component/AI/constant/model';"
    expected_count: 1
  - id: home_recommendations_fast_model
    file: apps/web/src/lib/queries/ai/createHomeRecommendations.ts
    search: "model: FREE_DEFAULT_MODEL,"
    replace: "model: Model.gpt56Mini,"
    expected_count: 1
