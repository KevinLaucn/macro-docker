version: 1

# Keep paths narrow enough to identify the fork feature that needs review.
# Test group names are implemented by .github/workflows/upstream-sync.yml.
customizations:
  - id: FORK-GOVERNANCE-001
    title: Private fork governance and upstream parity gates
    rationale: Keep fork policy in private Skills and machine gates while upstream-provided Skills remain byte-identical to the selected upstream target.
    risk: high
    paths:
      - .agents/skills/macro-private-maintainer/**
      - .agents/skills/macro-pre-push-gate/**
      - .github/scripts/check-core-drift.rb
      - .github/scripts/check-private-hooks.rb
      - tooling/just/check.just
      - docs/FORK_DEVELOPMENT.md
    tests:
      - conventions
      - workflow-lint

  - id: FORK-PACKAGES-001
    title: Isolated private fork feature packages
    rationale: Keep fork-owned feature implementations together and minimize upstream source changes.
    risk: high
    paths:
      - packages/fork/**
      - .fork/overrides/**
    tests:
      - conventions

  - id: EMAIL-PARTICIPANT-IDENTITY-001
    title: Unified Gmail self-identity and participant display
    rationale: Show all linked Gmail addresses as me while preserving distinct external contacts and existing inbox attribution avatars.
    risk: medium
    paths:
      - packages/fork/email-participant-identity/**
      - apps/web/src/features/entity/extractors/entity-email-participants.tsx
      - apps/web/src/features/entity/queries/email.ts
      - apps/web/src/features/entity/types/entity.ts
      - apps/web/src/lib/core/component/UserIcon.tsx
      - apps/web/src/features/email-view/queries/use-email-query.ts
      - crates/models_email/src/email/service/contact.rs
      - apps/web/tsconfig.json
      - .fork/private-hooks.yml
    tests:
      - conventions
      - email-identity
      - web

  - id: READ-RECEIPTS-001
    title: Isolated read receipts and email tracking
    rationale: Keep send-side open tracking, status APIs, settings, pixel handling, and compatibility hooks in one fork-owned feature package without changing the public contract.
    risk: high
    paths:
      - packages/fork/read-receipts/**
      - services/email_service/src/api.rs
      - services/email_service/src/api/email/messages.rs
      - services/email_service/src/api/email/settings.rs
      - services/email_service/src/features/mod.rs
      - services/email_service/src/main.rs
      - services/email_service/src/openapi.rs
      - services/email_service/src/pubsub/scheduled/process.rs
      - services/email_service/src/util/gmail/send/mod.rs
      - crates/email_db_client/src/lib.rs
      - crates/email_db_client/src/settings.rs
      - crates/email_utils/src/lib.rs
      - apps/web/src/features/email-compose/primitives/prepare-email-body.ts
      - apps/web/src/features/email-message/components/collapsed-message.tsx
      - apps/web/src/features/email-message/components/email-message-top-bar.tsx
      - apps/web/src/features/extensions/Extensions.tsx
      - apps/web/src/features/settings/ReadReceiptsSection.tsx
      - apps/web/src/features/block-email/util/readReceipts.ts
      - apps/web/src/features/block-email/component/TopBar.tsx
      - apps/web/src/features/next-soup/actions/make-delete-action.ts
      - apps/web/src/features/next-soup/utils.ts
      - apps/web/src/features/notifications/notification-platform.ts
      - apps/web/src/lib/queries/email/readReceipts.ts
      - apps/web/src/lib/queries/sync/SyncProvider.tsx
      - apps/web/src/lib/service-clients/service-email/readReceiptsClient.ts
      - apps/web/src/features/entity/extractors/entity-icon.tsx
      - apps/web/src/features/email-view/queries/use-email-query.ts
      - apps/web/src/index.css
      - package.json
      - apps/web/vitest.config.ts
      - .github/workflows/upstream-sync-test-group.yml
      - .github/workflows/self-host-images.yml
      - .fork/private-hooks.yml
    tests:
      - conventions
      - email-rust
      - web

  - id: CRM-MULTI-INBOX-001
    title: CRM backfill multi-inbox compatibility patch
    rationale: The upstream CRM backfill targets one macro-id email; this small compatibility patch fans out only across the user's accessible inboxes and must be retired when upstream PR #6370 provides the same behavior.
    risk: medium
    paths:
      - services/email_service/src/pubsub/backfill/populate_crm_for_user.rs
      - services/email_service/src/pubsub/backfill/depopulate_crm_for_user.rs
      - .fork/private-hooks.yml
      - .fork/retirements.yml
    tests:
      - conventions
      - email-rust

  - id: SELFHOST-HEALTH-001
    title: Isolated self-host health diagnostics
    rationale: Preserve the self-host health report, permission gate, routes, probes, and admin UI while keeping fork implementation code out of upstream-owned directories.
    risk: high
    paths:
      - packages/fork/self-host-health/**
      - services/authentication_service/src/api.rs
      - services/authentication_service/src/main.rs
      - services/authentication_service/src/openapi.rs
      - services/document_storage_service/src/api/internal.rs
      - apps/web/src/components/app/Layout.tsx
      - apps/web/src/lib/core/constant/SettingsState.tsx
      - apps/web/src/lib/core/constant/settingsTabsConfig.tsx
      - apps/web/src/features/settings/Settings.tsx
      - apps/web/src/features/settings/SettingsTabContent.tsx
      - apps/web/src/lib/service-clients/service-auth/client.ts
      - apps/web/src/lib/queries/ai/createHomeRecommendations.ts
      - apps/web/src/routes/Root.tsx
      - crates/ai_projections/src/domain/ai_projection_service.rs
      - self-host/scripts/check-drift.py
      - self-host/scripts/affected-services.py
      - .github/workflows/self-host-images.yml
    tests:
      - conventions
      - auth-rust
      - web
      - selfhost-config

  - id: SELFHOST-RUNTIME-001
    title: Private self-host runtime and zero-cloud behavior
    rationale: Preserve the private Docker/VPS topology and prevent implicit Macro cloud dependencies.
    risk: high
    paths:
      - self-host/**
      - docker/**
      - nix/**
      - tooling/xtask/crates/xtask_local/**
      - tooling/just/**
      - apps/web/src/lib/core/constant/featureFlags.ts
      - services/sync-service/wrangler.docker.toml
      - services/document_cognition_service/src/service/chat_renamer.rs
    tests:
      - conventions
      - selfhost-config

  - id: SELFHOST-SEARCH-UPLOAD-001
    title: Self-host document search upload bridge
    rationale: In official AWS, services/search_upload_handler forwards S3/EventBridge document upload events to DSS, which emits DocumentTopicEvent::ContentUploaded to drive Search Processor. Self-host uses LocalStack without AWS EventBridge/Lambda pipelines; packages/fork/search-upload-worker and self-host infrastructure replicate identical event semantics while maintaining 0 diff against upstream search_upload_handler.
    risk: high
    paths:
      - packages/fork/search-upload-worker/**
      - self-host/init/reconcile-localstack.sh
      - self-host/docker-compose.yml
      - self-host/.env.example
      - self-host/scripts/check-drift.py
      - nix/cloud-storage.nix
      - Cargo.toml
      - .fork/private-hooks.yml
    tests:
      - conventions
      - selfhost-config

  - id: TELEMETRY-PRIVACY-001
    title: Private telemetry and analytics boundary
    rationale: Keep analytics and telemetry independently reviewable from deployment/runtime changes; self-host must not silently fall back to official PostHog or other hosted collectors.
    risk: high
    paths:
      - apps/web/src/lib/analytics/**
      - services/analytics-proxy/**
      - self-host/docker-compose.yml
      - self-host/Caddyfile
      - docker/analytics-proxy.Dockerfile
      - .github/scripts/check-zero-cloud.rb
    tests:
      - conventions
      - selfhost-config

  - id: SELFHOST-MEDIA-001
    title: Self-hosted static image proxy compatibility
    rationale: Bypass the image proxy only for first-party self-hosted static files, preserving SSRF protection for external images.
    risk: medium
    paths:
      - apps/web/src/features/email-message/rendering-adapter.ts
      - packages/email-renderer/src/core/resource-policy.ts
      - .fork/private-hooks.yml
    tests:
      - conventions
      - web

  - id: EMAIL-SELFHOST-001
    title: Self-hosted Gmail and email service behavior
    rationale: Preserve Gmail synchronization, sending, tracking, and local worker behavior without Macro cloud services.
    risk: high
    paths:
      - services/email_service/**
      - services/email_service/src/bin/pubsub_workers/pubsub_workers.rs
      - services/email_service/src/api/email/links/health_check.rs
      - crates/email/**
      - crates/email_db_client/**
      - crates/email_api_client/**
      - crates/email_utils/**
      - apps/web/src/features/block-email/**
      - apps/web/src/features/email-message/**
      - apps/web/src/lib/service-clients/service-email/**
    tests:
      - conventions
      - email-rust


  - id: AUTH-SELFHOST-001
    title: Self-host authentication and identity consistency
    rationale: >-
      Protect only the self-host identity boundary: deployment URL, OAuth callback
      validation, FusionAuth initialization, and the small client fallback needed
      when SaaS-only auth endpoints are absent. Health checks, billing, i18n, and
      general upstream authentication remain outside this customization.
    risk: high
    paths:
      - services/authentication_service/src/api/utils.rs
      - services/authentication_service/src/api/login/sso.rs
      - services/authentication_service/src/api/oauth2.rs
      - services/authentication_service/src/api/link/gmail.rs
      - services/authentication_service/src/api/link/gmail/test.rs
      - services/authentication_service/src/api/oauth.rs
      - crates/soup/src/outbound/pg_soup_repo/candidate_gates.rs
      - services/authentication_service/src/main.rs
      - services/authentication_service/Cargo.toml
      - self-host/init/Dockerfile
      - self-host/init/provision.sh
      - self-host/init/render-kickstart.sh
      - self-host/kickstart/**
      - self-host/scripts/reconcile_fusionauth_idp.py
      - apps/web/src/lib/service-clients/service-auth/client.ts
    tests:
      - conventions
      - auth-rust

  - id: I18N-ZH-CN-001
    title: Explicit Chinese localization
    rationale: Preserve the fork's explicit i18n runtime, extraction rules, and zh-CN coverage.
    risk: medium
    paths:
      - packages/fork/i18n/**
      - rules/ast-grep/**
      - sgconfig.yml
      - apps/web/src/features/auth/GithubReauthenticationPrompt.tsx
      - apps/web/src/features/auth/GmailReauthenticationPrompt.tsx
      - apps/web/src/features/settings/ConnectedAccounts.tsx
      - apps/web/src/features/settings/Integrations.tsx
      - apps/web/src/features/companies/Company/Company.tsx
      - apps/web/src/features/companies/Company/CompanyContactsSection.tsx
      - apps/web/src/features/contacts/Contact/**
      - apps/web/vite.base.ts
    tests:
      - conventions
      - i18n

  - id: EMAIL-TRANSLATION-001
    title: Isolated browser email translation
    rationale: Preserve on-device email translation behavior while keeping upstream email UI files limited to registered hooks.
    risk: high
    paths:
      - packages/fork/email-translation/**
      - apps/web/src/features/email-message/components/email-message-top-bar.tsx
      - apps/web/src/features/email-message/primitives/email-message-body.ts
      - apps/web/src/features/email-message/views/email-message-body.tsx
      - apps/web/src/features/email-thread/primitives/thread-navigation.ts
      - apps/web/src/features/email-thread/views/message-list.tsx
      - apps/web/src/features/entity/composed/list-entity/email.tsx
      - apps/web/src/features/extensions/Extensions.tsx
      - apps/web/src/features/next-soup/soup-view/filters-bar/soup-filters-bar.tsx
      - apps/web/src/features/email-view/components/EmailControls.tsx
      - apps/web/src/features/email-view/components/EmailList.tsx
      - apps/web/src/features/email-view/components/EmailHeader.tsx
      - apps/web/src/features/email-view/components/EmailSidebar.tsx
      - apps/web/src/features/email-view/email-list-translation-context.tsx
      - apps/web/src/features/email-view/email-view.tsx
      - apps/web/src/features/next-soup/soup-view/use-soup-view-hotkeys.ts
      - .fork/private-hooks.yml
    tests:
      - conventions
      - email-translation



  - id: FORK-CI-001
    title: Private fork build and release pipelines
    rationale: Preserve private image builds, release gates, and fork-specific CI infrastructure.
    risk: high
    paths:
      - .github/workflows/self-host-images.yml
      - .github/workflows/nix-cache-health.yml
      - .github/workflows/release.yml
      - .github/actions/setup-nix/**
      - .github/scripts/**
      - .fork/**
    tests:
      - conventions
      - workflow-lint

  - id: ADOBE-ATTACHMENT-PREVIEW-001
    title: Adobe Illustrator and EPS attachment preview
    rationale: Provide lightweight client-side AI/EPS inspection, TIFF extraction, and explicit status states without cloud or Ghostscript dependencies.
    risk: low
    paths:
      - packages/fork/adobe-preview/**
      - apps/web/src/features/email-message/attachment-action-adapter.ts
      - apps/web/src/features/email-message/components/attachment-pill.tsx
      - apps/web/src/features/block-unknown/component/Block.tsx
      - apps/web/tsconfig.json
      - apps/web/vite.base.ts
      - .fork/private-hooks.yml
    tests:
      - conventions
      - web
