  - id: SELFHOST-SEARCH-UPLOAD-001
    title: Self-host document search upload bridge
    rationale: In official AWS, services/search_upload_handler forwards S3/EventBridge document upload events to DSS, which emits DocumentTopicEvent::ContentUploaded to drive Search Processor. Self-host uses LocalStack without AWS EventBridge/Lambda pipelines; packages/fork/search-upload-worker and self-host infrastructure replicate identical event semantics while maintaining 0 diff against upstream search_upload_handler.
    risk: high
    paths:
      - packages/fork/search-upload-worker/**
      - self-host/init/reconcile-localstack.sh
      - self-host/docker-compose.yml
      - self-host/.env.example
      - self-host/scripts/check-drift.py
      - nix/cloud-storage.nix
      - Cargo.toml
      - Cargo.lock
      - .github/workspace-dep-closures.json
      - .fork/private-hooks.yml
    owned_paths:
      - .github/workspace-dep-closures.json
      - Cargo.lock
      - Cargo.toml
      - nix/cloud-storage.nix
    tests:
      - conventions
      - selfhost-config

