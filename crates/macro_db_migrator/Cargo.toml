[package]
edition = "2024"
name = "macro_db_migrator"
publish = false
version = "0.1.0"

[features]
cli = ["dep:tokio"]
comment-import = [
  "dep:clap",
  "dep:database_env_vars",
  "dep:macro_entrypoint",
  "dep:macro_env",
  "dep:macro_uuid",
  "dep:rootcause",
  "dep:serde_json",
  "dep:tokio",
  "dep:tracing",
]

[[bin]]
name = "macro_db_migrate"
required-features = ["cli"]

[[bin]]
name = "comment_import"
required-features = ["comment-import"]

[dependencies]
sqlx = { workspace = true, features = ["migrate"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
