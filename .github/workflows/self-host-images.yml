# Builds and publishes the images a self-hosted deployment runs.
#
# Hand-written self-host image workflow, rather than generated by
# `cargo x workflows`: it is not part of Macro's own deploy pipeline and does
# not touch AWS or Pulumi.
#
# The service image builds the focused Email production aggregate consumed by the
# VPS deployment. It intentionally avoids the full local development stack.
name: Self-host images

on:
  push:
    branches:
      - main
      - test/nix-s3-auth-poc
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish (e.g. v1.2.3, or `latest`)
        type: string
        required: true
        default: latest
      services_runner:
        description: Runner for macro-services Rust build (github or self-hosted)
        type: choice
        options:
          - github
          - self-hosted
        required: false
        default: github
      upload_nix_cache:
        description: Upload newly built Nix store paths to the private S3 cache
        type: boolean
        required: false
        default: false

concurrency:
  group: self-host-images-${{ github.ref }}
  # Only the newest image build for a branch is useful; stop stale queued or
  # running builds when a newer push supersedes them.
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}

jobs:
  # Cheap and first: a drifted compose file publishes images nobody can run.
  check-drift:
    name: Check self-host artifacts
    runs-on: ubuntu-latest
    outputs:
      run_services: ${{ steps.filter.outputs.run_services }}
      run_web: ${{ steps.filter.outputs.run_web }}
      run_workers: ${{ steps.filter.outputs.run_workers }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'
          fetch-depth: 0
      - name: Check for drift from the service inventory
        run: python3 self-host/scripts/check-drift.py
      - name: Check for SQLx compile-time query drift
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            if git rev-parse --verify "${head}~1" >/dev/null 2>&1; then
              base="${head}~1"
            else
              base="$(git rev-list --max-parents=0 "$head" | tail -n 1)"
            fi
          fi
          python3 self-host/scripts/check-sqlx-drift.py --base "$base" --head "$head"
      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_services=true" >> "$GITHUB_OUTPUT"
            echo "run_web=true" >> "$GITHUB_OUTPUT"
            echo "run_workers=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          head="${{ github.sha }}"

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$head" | tail -n 1)"
          fi

          changed_files="$(git diff --name-only "$base" "$head")"

          has_match() {
            local pattern
            for pattern in "$@"; do
              if printf '%s\n' "$changed_files" | grep -Eq "$pattern"; then
                return 0
              fi
            done
            return 1
          }

          run_services=false
          run_web=false
          run_workers=false

          if has_match \
            '^Cargo\.toml$' \
            '^Cargo\.lock$' \
            '^crates/' \
            '^services/' \
            '^nix/cloud-storage\.nix$' \
            '^self-host/scripts/' \
            '^\.github/actions/setup-nix/action\.yml$'; then
            run_services=true
          fi

          if has_match \
            '^apps/web/' \
            '^packages/' \
            '^self-host/images/Dockerfile\.web$'; then
            run_web=true
          fi

          if has_match \
            '^docker/websocket-service\.Dockerfile$' \
            '^services/websocket_service/' \
            '^crates/.*/websocket'; then
            run_workers=true
          fi

          echo "run_services=$run_services" >> "$GITHUB_OUTPUT"
          echo "run_web=$run_web" >> "$GITHUB_OUTPUT"
          echo "run_workers=$run_workers" >> "$GITHUB_OUTPUT"

  services:
    name: macro-services
    needs: check-drift
    if: needs.check-drift.outputs.run_services == 'true'
    runs-on: ${{ (inputs.services_runner == 'self-hosted') && fromJSON('["self-hosted", "linux", "x64", "macro-builder"]') || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'
      - id: version
        run: echo "value=${{ inputs.version || (github.ref_type == 'branch' && 'latest') || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Determine Nix cache policy
        id: cache_policy
        env:
          NIX_CACHE_SIGNING_KEY_SECRET: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          upload=false
          reason="read-only"

          event_name="${{ github.event_name }}"
          ref="${{ github.ref }}"
          dispatch_upload="${{ inputs.upload_nix_cache || 'false' }}"

          if [[ "$event_name" == "push" && "$ref" == "refs/heads/main" ]]; then
            upload=true
            reason="trusted main push"
          elif [[ "$event_name" == "workflow_dispatch" && "$dispatch_upload" == "true" ]]; then
            upload=true
            reason="trusted manual upload requested"
          elif [[ "$event_name" == "pull_request" ]]; then
            upload=false
            reason="pull_request is untrusted (read-only)"
          else
            upload=false
            reason="untrusted branch/ref ($ref)"
          fi

          if [[ "$upload" == "true" ]]; then
            if [[ -z "${NIX_CACHE_SIGNING_KEY_SECRET:-}" ]]; then
              echo "::warning::Nix cache upload requested but NIX_CACHE_SIGNING_KEY is not configured; falling back to read-only cache."
              upload=false
              reason="missing NIX_CACHE_SIGNING_KEY secret"
            fi
          fi

          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          echo "================ NIX CACHE POLICY ================"
          if [[ "$upload" == "true" ]]; then
            echo "Mode: READ+WRITE"
            echo "Streaming upload: enabled"
          else
            echo "Mode: READ-ONLY"
            echo "Streaming upload: disabled"
          fi
          echo "Reason: $reason"
          if [[ -n "${{ vars.NIX_CACHE_URL }}" ]]; then
            echo "Substituter: configured"
          else
            echo "Substituter: not configured"
          fi
          echo "=================================================="

      - name: Setup Nix
        id: setup_nix
        uses: './.github/actions/setup-nix'
        with:
          nix-cache-url: ${{ vars.NIX_CACHE_URL }}
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          nix-cache-signing-key: ${{ steps.cache_policy.outputs.upload == 'true' && secrets.NIX_CACHE_SIGNING_KEY || '' }}
          fail-on-cache-error: 'true'

      - name: Build diagnostics before build
        run: |
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h
          echo "=== Target ==="
          echo "Profile: email"
          echo "Runner: ${{ inputs.services_runner || 'github' }}"
          echo "BUILD_START_TIME=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Build service binaries
        env:
          NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
          NIX_CACHE_SIGNING_KEY: ${{ steps.cache_policy.outputs.upload == 'true' && secrets.NIX_CACHE_SIGNING_KEY || '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p self-host/build/bin

          # Concurrency policy:
          # Use conservative concurrency on ephemeral GitHub-hosted runners (--max-jobs 2 --cores 4).
          # Keeping max-jobs=2 limits blast radius while allowing one extra parallel derivation.
          # cargoBuildHook passes -j $NIX_BUILD_CORES (-j 4) to cargo inside the derivation.
          if [ "${{ inputs.services_runner || 'github' }}" = "github" ]; then
            echo "Applying conservative concurrency settings for GitHub hosted runner (--max-jobs 2 --cores 4)"
            NIX_JOBS_FLAG="--max-jobs 2 --cores 4"
          else
            NIX_JOBS_FLAG=""
          fi

          echo "Building focused email production aggregate: .#self-host-email-binaries"

          # 1. Print S3 cache status
          if [ -n "${NIX_CACHE_URL:-}" ]; then
            SAN_URL=$(echo "$NIX_CACHE_URL" | sed -E 's/secret-key=[^&]+(&|$)/[REDACTED]\1/g')
            echo "[CACHE] S3 substituter: enabled"
            echo "[CACHE] S3 URL: $SAN_URL"
          else
            echo "[CACHE] S3 substituter: disabled"
          fi

          # 2. Dry-run to generate pre-build plan
          echo "Generating build plan via dry-run..."
          nix build --dry-run ".#self-host-email-binaries" 2> /tmp/nix-dry-run.log || true

          cat << 'EOF' > /tmp/print_plan.py
          import re, sys

          KEY_PATTERNS = [
              'self-host-email-binaries',
              'self-host-email-deps',
              'cargo-vendor-dir',
              'crane-utils',
              'rustc',
              'cargo',
              'clippy',
          ]

          def get_name(path):
              fn = path.split('/')[-1]
              if '-' in fn:
                  parts = fn.split('-', 1)
                  if len(parts[0]) == 32:
                      fn = parts[1]
              return fn.replace('.drv', '')

          def is_key(name):
              return any(k in name for k in KEY_PATTERNS)

          fetch_list = []
          build_list = []
          mode = None

          try:
              with open('/tmp/nix-dry-run.log', 'r') as f:
                  for line in f:
                      line = line.strip()
                      if 'will be fetched' in line:
                          mode = 'fetch'
                          continue
                      elif 'will be built' in line:
                          mode = 'build'
                          continue
                      elif line.startswith('evaluating') or line.startswith('warning:'):
                          continue

                      if mode == 'fetch' and line.startswith('/nix/store/'):
                          fetch_list.append(line)
                      elif mode == 'build' and line.startswith('/nix/store/'):
                          build_list.append(line)
          except Exception as e:
              print(f"Failed to parse dry-run: {e}")
              sys.exit(0)

          print("\n========== BUILD PLAN ==========")
          print(f"From cache (substituter): {len(fetch_list)} paths")
          print(f"To build (local):        {len(build_list)} derivations")
          print("Key derivations:")

          seen_keys = set()
          for p in fetch_list:
              n = get_name(p)
              if is_key(n) and n not in seen_keys:
                  seen_keys.add(n)
                  print(f"  [CACHE] {n}")

          for p in build_list:
              n = get_name(p)
              if is_key(n) and n not in seen_keys:
                  seen_keys.add(n)
                  print(f"  [BUILD] {n}")

          if not seen_keys:
              print("  (No key derivations identified in dry-run)")
          print("================================\n")
          EOF
          python3 /tmp/print_plan.py

          # 3. Create live stream filter script
          cat << 'EOF' > /tmp/filter_nix_logs.py
          import sys, re, time

          SKIP_PATTERNS = ('cargo-src-', 'cargo-package-')

          def fmt_duration(sec):
              sec = int(round(sec))
              m, s = divmod(sec, 60)
              h, m = divmod(m, 60)
              if h > 0:
                  return f"{h}h {m}m {s}s"
              elif m > 0:
                  return f"{m}m {s}s"
              else:
                  return f"{s}s"

          current_drv = None
          current_drv_start = None

          for raw_line in sys.stdin:
              line = raw_line.rstrip('\r\n')
              now = time.time()

              # Tagging S3 / Public substituter / Build
              m_copy = re.search(r"copying path '([^']+)' from '([^']+)'", line)
              if m_copy:
                  if current_drv:
                      dur = now - current_drv_start
                      print(f"  └─ Finished {current_drv} in {fmt_duration(dur)}")
                      current_drv = None
                  path, src = m_copy.group(1), m_copy.group(2)
                  name = path.split('/')[-1]
                  if '-' in name and len(name.split('-', 1)[0]) == 32:
                      name = name.split('-', 1)[1]
                  if src.startswith('s3://'):
                      tag = "[CACHE:S3]"
                  else:
                      tag = "[CACHE:PUBLIC]"
                  print(f"{tag} {name}")
                  sys.stdout.flush()
                  continue

              m_build = re.search(r"building '([^']+)'", line)
              if m_build:
                  if current_drv:
                      dur = now - current_drv_start
                      print(f"  └─ Finished {current_drv} in {fmt_duration(dur)}")
                  drv = m_build.group(1)
                  name = drv.split('/')[-1]
                  if '-' in name and len(name.split('-', 1)[0]) == 32:
                      name = name.split('-', 1)[1]
                  name = name.replace('.drv', '')
                  # Filter noisy unpack drvs
                  if any(sp in name for sp in SKIP_PATTERNS):
                      current_drv = None
                      continue
                  current_drv = name
                  current_drv_start = now
                  print(f"[BUILD] {name}")
                  sys.stdout.flush()
                  continue

              # Filter unpacking / unpacker lines for individual crates
              if any(sp in line for sp in SKIP_PATTERNS):
                  continue
              if 'unpacking source archive' in line:
                  continue

              # Print other logs (cargo compiler output, status, warnings)
              print(line)
              sys.stdout.flush()

          if current_drv:
              dur = time.time() - current_drv_start
              print(f"  └─ Finished {current_drv} in {fmt_duration(dur)}")
          EOF

          # Start background monitor for build observability (every 45s)
          # Cleaned up immediately without blocking exit
          MONITOR_PID=""
          cleanup_monitor() {
            if [ -n "$MONITOR_PID" ]; then
              kill -9 "$MONITOR_PID" 2>/dev/null || true
              MONITOR_PID=""
            fi
          }
          trap cleanup_monitor EXIT INT TERM

          (
            step_start=$(date -u +%s)
            while true; do
              sleep 120 || break
              now=$(date -u +%s)
              elapsed=$(( now - step_start ))
              mins=$(( elapsed / 60 ))
              echo "--- [BUILD MONITOR: ${mins}m elapsed] ---"
              echo "Load: $(uptime 2>/dev/null | awk -F'load average:' '{print $2}' || true) | $(free -h 2>/dev/null | awk '/Mem:/{print "Mem: "$3"/"$2}' || true)"
              df -h / 2>/dev/null | tail -n 1 || true
              pgrep -la 'rustc|cargo' 2>/dev/null | wc -l | xargs -I{} echo "Active rustc/cargo processes: {}"
            done
          ) &
          MONITOR_PID=$!

          # Start streaming cache uploader in background
          UPLOADER_PID=""
          if [ -n "${NIX_CACHE_URL:-}" ] && [ -n "${NIX_CACHE_SIGNING_KEY:-}" ]; then
            echo "Starting background streaming Nix cache uploader..."
            # Test if nix copy supports --no-recursive
            NO_RECURSIVE_FLAG=""
            if nix copy --help 2>&1 | grep -q -- '--no-recursive'; then
              NO_RECURSIVE_FLAG="--no-recursive"
              echo "[CACHE] nix copy --no-recursive is supported and enabled."
            else
              echo "[CACHE] nix copy --no-recursive not supported, falling back to standard copy."
            fi

            cat << 'EOF_UPLOADER' > /tmp/run_cache_uploader.sh
          #!/bin/bash
          set -u

          BASE_DIR="/var/lib/nix-cache-upload"
          SPOOL_DIR="$BASE_DIR/spool"
          INFLIGHT_DIR="$BASE_DIR/inflight"
          FAILED_DIR="$BASE_DIR/failed"
          STOP_FILE="$BASE_DIR/stop"
          DONE_FILE="$BASE_DIR/done"
          STATS_FILE="$BASE_DIR/stats.txt"

          mkdir -p "$SPOOL_DIR" "$INFLIGHT_DIR" "$FAILED_DIR"

          BATCH_SIZE=48
          FLUSH_INTERVAL=5
          MAX_REQUEUES=3

          TOTAL_UPLOADED=0
          TOTAL_FAILED=0
          BATCH_COUNT=0

          # On startup, rescue any uncommitted inflight items back to spool
          if [ -d "$INFLIGHT_DIR" ]; then
            find "$INFLIGHT_DIR" -type f -name "*.path" -exec mv -f {} "$SPOOL_DIR/" \; 2>/dev/null || true
            find "$INFLIGHT_DIR" -mindepth 1 -type d -empty -delete 2>/dev/null || true
          fi

          # Prepare destination URI
          if [ -n "${NIX_COPY_KEY:-}" ]; then
            key_arg="secret-key=${NIX_COPY_KEY}"
            sep='?'; [[ "$NIX_CACHE_URL" == *\?* ]] && sep='&'
            dest="${NIX_CACHE_URL}${sep}${key_arg}"
          else
            dest="${NIX_CACHE_URL:-}"
          fi

          last_summary=$(date +%s)

          while true; do
            is_stopping=false
            if [ -f "$STOP_FILE" ]; then
              is_stopping=true
            fi

            # Atomic batch claim:
            # 1. Create a unique batch directory in $INFLIGHT_DIR
            batch_id="$(date +%s%N 2>/dev/null || date +%s)_$$"
            batch_dir="$INFLIGHT_DIR/batch_$batch_id"
            mkdir -p "$batch_dir"

            # 2. Claim up to BATCH_SIZE files from SPOOL_DIR via atomic mv
            claimed_count=0
            for f in "$SPOOL_DIR"/*.path; do
              [ -f "$f" ] || break
              if mv "$f" "$batch_dir/" 2>/dev/null; then
                claimed_count=$(( claimed_count + 1 ))
                [ "$claimed_count" -ge "$BATCH_SIZE" ] && break
              fi
            done

            if [ "$claimed_count" -gt 0 ]; then
              BATCH_COUNT=$(( BATCH_COUNT + 1 ))

              # Read and sanitize store paths from claimed batch
              batch_paths=()
              for cf in "$batch_dir"/*.path; do
                [ -f "$cf" ] || continue
                p=$(cat "$cf" 2>/dev/null || true)
                if [ -n "$p" ] && [[ "$p" == /nix/store/* ]]; then
                  batch_paths+=("$p")
                fi
              done

              # Deduplicate store paths
              unique_paths=()
              if [ "${#batch_paths[@]}" -gt 0 ]; then
                while IFS= read -r up; do
                  [ -n "$up" ] && unique_paths+=("$up")
                done < <(printf '%s\n' "${batch_paths[@]}" | sort -u)
              fi

              unique_count=${#unique_paths[@]}

              if [ "$unique_count" -gt 0 ]; then
                # Attempt upload with retry and exponential backoff
                success=false
                delay=2
                for attempt in 1 2 3; do
                  if nix copy $NO_RECURSIVE_FLAG --to "$dest" "${unique_paths[@]}" 2>/dev/null; then
                    success=true
                    break
                  else
                    sleep "$delay"
                    delay=$(( delay * 2 ))
                  fi
                done

                if [ "$success" = true ]; then
                  # ACK: Successfully uploaded! Delete claimed files and batch directory
                  rm -rf "$batch_dir"
                  TOTAL_UPLOADED=$(( TOTAL_UPLOADED + unique_count ))
                else
                  # REQUEUE: Handle failures by inspecting retry counts in filename
                  echo "[STREAMING CACHE WARNING] Failed to upload batch of $unique_count paths; evaluating requeue..." >&2
                  for cf in "$batch_dir"/*.path; do
                    [ -f "$cf" ] || continue
                    base=$(basename "$cf" .path)
                    retries=0
                    if [[ "$base" =~ \.retry([0-9]+)$ ]]; then
                      retries="${BASH_REMATCH[1]}"
                      base="${base%.retry*}"
                    fi
                    retries=$(( retries + 1 ))

                    if [ "$retries" -ge "$MAX_REQUEUES" ]; then
                      mv "$cf" "$FAILED_DIR/${base}.failed" 2>/dev/null || rm -f "$cf"
                      TOTAL_FAILED=$(( TOTAL_FAILED + 1 ))
                    else
                      mv "$cf" "$SPOOL_DIR/${base}.retry${retries}.path" 2>/dev/null || rm -f "$cf"
                    fi
                  done
                  rmdir "$batch_dir" 2>/dev/null || true
                  sleep 5
                fi
              else
                # Empty/invalid paths in claimed batch, cleanup
                rm -rf "$batch_dir"
              fi
            else
              # No files claimed, cleanup empty batch_dir
              rmdir "$batch_dir" 2>/dev/null || true
            fi

            # Periodic progress logging
            now=$(date +%s)
            if (( now - last_summary >= 120 )); then
              spool_pending=$(find "$SPOOL_DIR" -maxdepth 1 -name "*.path" 2>/dev/null | wc -l || echo 0)
              echo "--- Streaming Nix cache: uploaded=${TOTAL_UPLOADED} failed=${TOTAL_FAILED} pending=${spool_pending} batches=${BATCH_COUNT} (PID $$) ---"
              last_summary=$now
            fi

            # Stop condition: STOP_FILE exists, spool is empty, and inflight is clean
            if $is_stopping; then
              spool_left=$(find "$SPOOL_DIR" -maxdepth 1 -name "*.path" 2>/dev/null | wc -l || echo 0)
              inflight_left=$(find "$INFLIGHT_DIR" -type f -name "*.path" 2>/dev/null | wc -l || echo 0)
              if [ "$spool_left" -eq 0 ] && [ "$inflight_left" -eq 0 ] && [ "$claimed_count" -eq 0 ]; then
                # Perform one final upload sweep on any quarantined failed paths before terminating
                failed_files=()
                for ff in "$FAILED_DIR"/*.failed; do
                  [ -f "$ff" ] && failed_files+=("$ff")
                done

                final_unrecovered=()
                if [ "${#failed_files[@]}" -gt 0 ]; then
                  echo "--- Finalizing Nix streaming cache: attempting one final upload sweep on ${#failed_files[@]} failed paths ---"
                  failed_paths=()
                  for ff in "${failed_files[@]}"; do
                    p=$(cat "$ff" 2>/dev/null || true)
                    [ -n "$p" ] && [[ "$p" == /nix/store/* ]] && failed_paths+=("$p")
                  done

                  unique_failed=()
                  while IFS= read -r p; do
                    [ -n "$p" ] && unique_failed+=("$p")
                  done < <(printf '%s\n' "${failed_paths[@]}" | sort -u)

                  if [ "${#unique_failed[@]}" -gt 0 ]; then
                    if nix copy $NO_RECURSIVE_FLAG --to "$dest" "${unique_failed[@]}" 2>/dev/null; then
                      echo "--- Recovered all ${#unique_failed[@]} previously failed paths in final sweep! ---"
                      TOTAL_UPLOADED=$(( TOTAL_UPLOADED + ${#unique_failed[@]} ))
                      rm -f "$FAILED_DIR"/*.failed
                    else
                      printf '%s\n' "${unique_failed[@]}" > "$BASE_DIR/unrecovered_failures.txt"
                      final_unrecovered=("${unique_failed[@]}")
                    fi
                  fi
                fi

                TOTAL_FAILED=${#final_unrecovered[@]}
                echo "--- Streaming Nix cache uploader completed: total_uploaded=${TOTAL_UPLOADED} total_failed=${TOTAL_FAILED} batches=${BATCH_COUNT} ---"
                printf 'TOTAL_UPLOADED=%s\nTOTAL_FAILED=%s\nBATCH_COUNT=%s\n' "$TOTAL_UPLOADED" "$TOTAL_FAILED" "$BATCH_COUNT" > "$STATS_FILE"
                touch "$DONE_FILE"
                break
              fi
            fi

            if [ "$claimed_count" -eq 0 ]; then
              sleep "$FLUSH_INTERVAL"
            fi
          done
          EOF_UPLOADER
            chmod +x /tmp/run_cache_uploader.sh
            key="$RUNNER_TEMP/nix-cache-signing-key"
            printf '%s\n' "$NIX_CACHE_SIGNING_KEY" > "$key"
            chmod 600 "$key"

            export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-}"
            export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-}"
            export NIX_CACHE_URL="${NIX_CACHE_URL}"
            export NIX_COPY_KEY="$key"
            export NO_RECURSIVE_FLAG="${NO_RECURSIVE_FLAG}"
            /tmp/run_cache_uploader.sh &
            UPLOADER_PID=$!
            echo "Streaming uploader running in background with PID $UPLOADER_PID"
          else
            echo "[CACHE] Streaming Nix cache uploads disabled; using configured substituters for reads only."
          fi

          # Validate pruned-source compile-time resources before the expensive
          # Rust dependency build. This catches sibling-crate assets such as
          # macro_db_client migrations in seconds instead of after an hour.
          nix build --print-build-logs ".#self-host-email-source-check" --out-link result-source-check

          BUILD_NIX_START=$(date -u +%s)
          set +e
          nix build --print-build-logs $NIX_JOBS_FLAG ".#self-host-email-binaries" --out-link result-bins 2>&1 \
            | tee /tmp/macro-nix-build.log \
            | python3 /tmp/filter_nix_logs.py
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          BUILD_NIX_END=$(date -u +%s)
          BUILD_DURATION_SEC=$(( BUILD_NIX_END - BUILD_NIX_START ))

          cleanup_monitor
          trap - EXIT INT TERM

          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
            echo "::error::nix build failed with exit code $BUILD_EXIT_CODE"
            exit "$BUILD_EXIT_CODE"
          fi

          # 4. Generate and print build summary on success
          cat << 'EOF' > /tmp/summarize_nix_build.py
          import re, sys, os

          raw_duration = sys.argv[1] if len(sys.argv) > 1 else "0"
          try:
              total_sec = int(raw_duration)
          except ValueError:
              total_sec = 0

          def fmt_duration(sec):
              if sec is None:
                  return "-"
              sec = int(round(sec))
              m, s = divmod(sec, 60)
              h, m = divmod(m, 60)
              if h > 0:
                  return f"{h}h {m}m {s}s"
              elif m > 0:
                  return f"{m}m {s}s"
              else:
                  return f"{s}s"

          KEY_PATTERNS = [
              'self-host-email-binaries',
              'self-host-email-deps',
              'cargo-vendor-dir',
              'crane-utils',
              'rustc',
              'cargo',
              'clippy',
          ]

          def get_name(path):
              fn = path.split('/')[-1]
              if '-' in fn:
                  parts = fn.split('-', 1)
                  if len(parts[0]) == 32:
                      fn = parts[1]
              return fn.replace('.drv', '')

          def is_key(name):
              return any(k in name for k in KEY_PATTERNS)

          s3_copies = set()
          pub_copies = set()
          builds = set()
          durations = {}

          if os.path.exists('/tmp/macro-nix-build.log'):
              with open('/tmp/macro-nix-build.log', 'r', errors='replace') as f:
                  for line in f:
                      m_copy = re.search(r"copying path '([^']+)' from '([^']+)'", line)
                      if m_copy:
                          p, src = m_copy.group(1), m_copy.group(2)
                          name = get_name(p)
                          if src.startswith('s3://'):
                              s3_copies.add(name)
                          else:
                              pub_copies.add(name)
                          continue
                      m_build = re.search(r"building '([^']+)'", line)
                      if m_build:
                          drv = m_build.group(1)
                          name = get_name(drv)
                          builds.add(name)
                          continue
                      m_finish = re.search(r"Finished ([\w\-]+) in ([\dh\sm]+)", line)
                      if m_finish:
                          d_name, d_str = m_finish.group(1), m_finish.group(2).strip()
                          durations[d_name] = d_str

          # Parse dry run to find local items
          dry_builds = set()
          dry_fetches = set()
          if os.path.exists('/tmp/nix-dry-run.log'):
              mode = None
              with open('/tmp/nix-dry-run.log', 'r', errors='replace') as f:
                  for line in f:
                      line = line.strip()
                      if 'will be fetched' in line:
                          mode = 'fetch'
                      elif 'will be built' in line:
                          mode = 'build'
                      elif mode == 'fetch' and line.startswith('/nix/store/'):
                          dry_fetches.add(get_name(line))
                      elif mode == 'build' and line.startswith('/nix/store/'):
                          dry_builds.add(get_name(line))

          print("\n========== NIX BUILD SUMMARY ==========")
          print(f"Total S3 cache hits:       {len(s3_copies)}")
          print(f"Total public cache hits:   {len(pub_copies)}")
          print(f"Total derivations built:   {len(builds)}")
          print(f"Total build step duration: {fmt_duration(total_sec)} ({total_sec}s)")
          print("\nKey derivations breakdown:")
          print(f"  {'Status':<16} | {'Duration':<10} | Derivation")
          print(f"  {'-'*16}-+-{'-'*10}-+-{'-'*40}")

          key_names = set()
          for n in list(s3_copies) + list(pub_copies) + list(builds) + list(dry_fetches) + list(dry_builds):
              if is_key(n):
                  key_names.add(n)

          for k in sorted(key_names):
              if any(k in b for b in builds):
                  status = "[BUILD]"
              elif any(k in s for s in s3_copies):
                  status = "[CACHE:S3]"
              elif any(k in p for p in pub_copies):
                  status = "[CACHE:PUBLIC]"
              else:
                  status = "[LOCAL]"

              dur_display = durations.get(k, "-")
              # If single aggregate build took up the step, display total duration if not captured
              if status == "[BUILD]" and dur_display == "-" and len(builds) <= 2:
                  dur_display = fmt_duration(total_sec)

              print(f"  {status:<16} | {dur_display:<10} | {k}")

          if not key_names:
              print("  (No key derivations recorded)")
          print("=======================================\n")
          EOF
          python3 /tmp/summarize_nix_build.py "$BUILD_DURATION_SEC"

          cp -L result-bins/bin/* self-host/build/bin/ 2>/dev/null \
            || cp -RL result-bins/* self-host/build/bin/

          # The seeding CLI is development tooling; it has no place in a
          # deployment image.
          rm -f self-host/build/bin/seed_cli
          ls -la self-host/build/bin

      - name: Failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          echo "=== Nix build failure diagnostics ==="
          if [ -f /tmp/macro-nix-build.log ]; then
            # Try to extract and show the failed derivation builder log
            FAILED_DRV=$(grep -oP '/nix/store/[^ ]+\.drv' /tmp/macro-nix-build.log | tail -1 || true)
            if [ -n "$FAILED_DRV" ]; then
              echo "=== Failed derivation: $FAILED_DRV ==="
              nix log "$FAILED_DRV" 2>/dev/null | tail -n 200 || echo "(nix log unavailable)"
              echo ""
            fi

            echo "=== Error summary ==="
            grep -nE 'error\[E|could not compile|SQLX_OFFLINE|Caused by:|failed to build|cargo:warning' /tmp/macro-nix-build.log | head -50 || true
            echo ""
            echo "=== Last 500 lines of raw build log ==="
            tail -n 500 /tmp/macro-nix-build.log || true
          else
            echo "No build log found at /tmp/macro-nix-build.log"
          fi

      - name: Upload failure log artifact
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macro-services-nix-failure-${{ github.run_id }}
          path: /tmp/macro-nix-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify production image contents
        run: |
          set -euo pipefail
          expected=(
            authentication_service
            connection_gateway_service
            contacts_service
            document_storage_service
            email_service
            pubsub_workers
            image_proxy_service
            notification_service
            static_file_service
            unfurl_service
            search_processing_service
            document_upload_finalizer_local_worker
            macro_db_migrate
          )

          for bin in "${expected[@]}"; do
            test -x "self-host/build/bin/$bin"
          done

          forbidden=(
            seed_cli
            agent_harness_service
            agent_trigger_service
            document_cognition_service
            convert_service
            mcp_server
            service
          )

          for bin in "${forbidden[@]}"; do
            test ! -e "self-host/build/bin/$bin"
          done

          echo "email production binary inventory matches the self-host profile"

      - name: Build diagnostics after build
        run: |
          echo "=== Disk after build ==="
          df -h
          if [ -d /nix/store ]; then
            echo "=== /nix/store size ==="
            du -sh /nix/store 2>/dev/null || true
          fi
          build_end=$(date -u +%s)
          build_dur=$(( build_end - BUILD_START_TIME ))
          echo "Nix/Rust build duration: ${build_dur}s"
          echo "BUILD_DURATION=${build_dur}" >> "$GITHUB_ENV"

      - name: Finalize Nix cache uploads
        if: success() && steps.setup_nix.outcome == 'success'
        env:
          CACHE_UPLOAD_ENABLED: ${{ steps.cache_policy.outputs.upload }}
        run: |
          set -uo pipefail
          QUEUE_DIR="/var/lib/nix-cache-upload"
          STOP_FILE="$QUEUE_DIR/stop"
          DONE_FILE="$QUEUE_DIR/done"
          STATS_FILE="$QUEUE_DIR/stats.txt"

          if [ ! -d "$QUEUE_DIR" ]; then
            echo "Streaming nix cache not active; skipping finalize."
            exit 0
          fi

          echo "Signaling background streaming cache uploader to finalize and flush remaining queue..."
          touch "$STOP_FILE"

          # Wait briefly on successful builds only. Failed builds skip this step
          # and use the cleanup step below so CI does not spend minutes flushing
          # partial cache uploads after a broken production artifact.
          TIMEOUT=30
          waited=0
          while [ ! -f "$DONE_FILE" ] && [ "$waited" -lt "$TIMEOUT" ]; do
            if ! pgrep -f "run_cache_uploader.sh" >/dev/null 2>&1 && [ ! -f "$DONE_FILE" ]; then
              echo "Streaming cache uploader process exited."
              break
            fi
            sleep 5
            waited=$(( waited + 5 ))
            if (( waited % 15 == 0 )); then
              spool_c=$(find "$QUEUE_DIR/spool" -maxdepth 1 -name "*.path" 2>/dev/null | wc -l || echo 0)
              inflight_c=$(find "$QUEUE_DIR/inflight" -type f -name "*.path" 2>/dev/null | wc -l || echo 0)
              echo "Waiting for cache uploader to finalize... elapsed: ${waited}s / ${TIMEOUT}s (pending spool: ${spool_c}, inflight: ${inflight_c})"
            fi
          done

          if [ -f "$DONE_FILE" ]; then
            echo "Streaming cache uploader flushed successfully within ${waited}s."
            if [ -f "$STATS_FILE" ]; then
              # shellcheck disable=SC1090
              source "$STATS_FILE" || true
              echo "Streaming Nix cache uploader completed"
              echo "TOTAL_UPLOADED=${TOTAL_UPLOADED:-0}"
              echo "TOTAL_FAILED=${TOTAL_FAILED:-0}"
              echo "BATCH_COUNT=${BATCH_COUNT:-0}"
              echo "=== Streaming Cache Upload Summary ==="
              echo "uploaded=${TOTAL_UPLOADED:-0} pending=0 failed=${TOTAL_FAILED:-0} batches=${BATCH_COUNT:-0}"
              echo "======================================"
              if [ "${CACHE_UPLOAD_ENABLED:-false}" = "true" ] && [ "${TOTAL_UPLOADED:-0}" -eq 0 ]; then
                echo "::warning::Main build was configured for cache upload, but no new Nix store paths were uploaded. Confirm whether this was a full cache hit or an uploader configuration problem."
              fi
              if [ "${TOTAL_FAILED:-0}" -gt 0 ]; then
                echo "::warning::Nix streaming cache finished with ${TOTAL_FAILED} failed derivations. These store paths were not saved to S3."
                if [ -f "$QUEUE_DIR/unrecovered_failures.txt" ]; then
                  echo "=== Unrecovered Store Paths ==="
                  cat "$QUEUE_DIR/unrecovered_failures.txt"
                  echo "==============================="
                fi
              fi
            fi
          else
            echo "::warning::Streaming cache uploader reached ${TIMEOUT}s timeout during finalization. Stopping uploader without failing production image build."
            pkill -f "run_cache_uploader.sh" 2>/dev/null || true
          fi

          rm -f "$RUNNER_TEMP/nix-cache-signing-key"

      - name: Stop Nix cache uploader after failed build
        if: failure() || cancelled()
        run: |
          set -uo pipefail
          QUEUE_DIR="/var/lib/nix-cache-upload"
          STOP_FILE="$QUEUE_DIR/stop"

          if [ ! -d "$QUEUE_DIR" ]; then
            echo "Streaming nix cache not active; skipping cleanup."
            exit 0
          fi

          echo "Build failed; stopping streaming Nix cache uploader without final flush."
          touch "$STOP_FILE" 2>/dev/null || true
          pkill -f "run_cache_uploader.sh" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/nix-cache-signing-key"

      - name: Teardown persistent Nix
        if: >-
          always() &&
          steps.setup_nix.outcome == 'success' &&
          steps.setup_nix.outputs.teardown-required == 'true'
        uses: './.github/actions/teardown-nix'

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          docker_start=$(date -u +%s)
          ns="$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          v="${{ steps.version.outputs.value }}"
          profile="email"
          service_img_name="macro-services-email"
          img="$REGISTRY/$ns/${service_img_name}:$v"
          docker build -f self-host/images/Dockerfile.services \
            --build-arg BIN_DIR=build/bin \
            --build-arg MACRO_VERSION="$v" \
            --label "com.kevinlaucn.macro.profile=$profile" \
            -t "$img" self-host
          docker push "$img"
          docker_dur=$(( $(date -u +%s) - docker_start ))
          bin_count=$(find self-host/build/bin -type f -perm -111 | wc -l | tr -d ' ')
          bin_size=$(du -sh self-host/build/bin | awk '{print $1}')

          {
            echo "### 🚀 Macro Services Build Summary"
            echo "- **Runner**: \`${{ inputs.services_runner || 'github' }}\`"
            echo "- **Profile**: \`email\`"
            echo "- **Image**: \`${img}\`"
            echo "- **Nix/Rust Build Duration**: \`${BUILD_DURATION}s\`"
            echo "- **Docker Build & Push Duration**: \`${docker_dur}s\`"
            echo "- **Binary Count**: \`${bin_count}\`"
            echo "- **Output Binaries Size**: \`${bin_size}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: macro-web
    needs: check-drift
    if: needs.check-drift.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'
      - name: Setup Nix
        id: setup_nix
        uses: './.github/actions/setup-nix'
        with:
          nix-cache-url: ${{ vars.NIX_CACHE_URL }}
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Build diagnostics before build
        run: |
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h

      - name: Build the frontend bundle
        # `same-origin` is what makes one image work on any hostname: the app
        # calls its APIs relative to wherever it is served from. Mirrors
        # xtask_local's `frontend::build_static`.
        run: |
          set -euo pipefail
          nix develop --command bash -c '
            bun install --frozen-lockfile
            cd apps/web
            MODE=development NODE_ENV=production \
            NODE_OPTIONS=--max-old-space-size=6144 \
            VITE_LOCAL_SERVERS=ALL \
            VITE_LOCAL_BACKEND_ORIGIN=same-origin \
            VITE_ENABLE_MARKDOWN_LIVE_COLLABORATION=false \
              bun run --bun build
          '
          mkdir -p self-host/build/dist
          cp -a apps/web/dist/. self-host/build/dist/
          test -f self-host/build/dist/index.html

      - name: Build diagnostics after build
        run: |
          echo "=== Disk after build ==="
          df -h

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          v="${{ inputs.version || (github.ref_type == 'branch' && 'latest') || github.ref_name }}"
          ns="$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          img="$REGISTRY/$ns/macro-web:$v"
          docker build -f self-host/images/Dockerfile.web \
            --build-arg DIST_DIR=build/dist --build-arg MACRO_VERSION="$v" \
            -t "$img" self-host
          docker push "$img"

  init:
    name: macro-init
    needs: [check-drift, services]
    if: needs.check-drift.outputs.run_services == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        # Pulls the migration runner out of the service image just published.
        run: |
          set -euo pipefail
          v="${{ needs.services.outputs.version }}"
          profile="email"
          ns="$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          service_img_name="macro-services-email"
          init_img_name="macro-init-email"
          img="$REGISTRY/$ns/${init_img_name}:$v"
          docker build -f self-host/init/Dockerfile \
            --build-arg MACRO_IMAGE_SERVICES="$REGISTRY/$ns/${service_img_name}" \
            --build-arg MACRO_VERSION="$v" \
            --label "com.kevinlaucn.macro.profile=$profile" \
            -t "$img" .
          docker push "$img"

  workers:
    name: ${{ matrix.image }}
    needs: check-drift
    if: needs.check-drift.outputs.run_workers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macro-websocket-service
            dockerfile: docker/websocket-service.Dockerfile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          set -euo pipefail
          v="${{ inputs.version || (github.ref_type == 'branch' && 'latest') || github.ref_name }}"
          ns="$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          img="$REGISTRY/$ns/${{ matrix.image }}:$v"
          docker build -f "${{ matrix.dockerfile }}" -t "$img" .
          docker push "$img"
