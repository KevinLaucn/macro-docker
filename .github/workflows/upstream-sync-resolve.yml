name: Resolve upstream sync
# resolver-revision: 4

on:
  push:
    branches:
      - 'sync/upstream-*'
    paths:
      - '.github/workflows/upstream-sync-resolve.yml'

permissions:
  contents: write

jobs:
  rebuild-on-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Fetch latest upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/macro-inc/macro.git 2>/dev/null || \
            git remote set-url upstream https://github.com/macro-inc/macro.git
          git fetch --no-tags upstream main
          echo "TARGET=$(git rev-parse upstream/main)" >> "$GITHUB_ENV"
          echo "PREMERGE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BASELINE=$(ruby -ryaml -e 'puts YAML.safe_load(File.read(%q[.fork/upstream.yml]))[%q[last_merged_upstream_sha]]')" >> "$GITHUB_ENV"

      - name: Build registered fork overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sync-artifacts
          cp .github/scripts/resolve-upstream-sync-conflicts.rb .sync-artifacts/resolve-upstream-sync-conflicts.rb
          ruby -c .github/scripts/build-fork-overlay.rb
          ruby -c .sync-artifacts/resolve-upstream-sync-conflicts.rb
          ruby .github/scripts/build-fork-overlay.rb \
            --baseline "$BASELINE" \
            --head "$PREMERGE" \
            --patch .sync-artifacts/fork-overlay.patch \
            --selected .sync-artifacts/selected.txt \
            --dropped .sync-artifacts/dropped.txt
          echo "selected paths: $(wc -l < .sync-artifacts/selected.txt)"
          echo "dropped historical drift: $(wc -l < .sync-artifacts/dropped.txt)"
          echo "===== SELECTED FORK OVERLAY PATHS ====="
          cat .sync-artifacts/selected.txt
          echo "===== FORK FEATURE FLAG REFERENCES ====="
          grep -R -n -E "getAppCapabilities|enableDirectAttachmentDownload|isSelfHost|ENABLE_INBOX_NOTIFIED_SORT|ENABLE_MARKDOWN_LIVE_COLLABORATION" apps packages self-host 2>/dev/null || true

      - name: Rebuild merge from upstream and apply fork overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "macro-upstream-sync"
          git config user.email "actions@users.noreply.github.com"

          git merge --no-commit --no-ff -s ours "$TARGET"
          git read-tree --reset -u "$TARGET"

          set +e
          git apply --3way --index .sync-artifacts/fork-overlay.patch
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            git diff --name-only --diff-filter=U | tee .sync-artifacts/conflicts.txt
            git status --short > .sync-artifacts/status.txt
            git diff --cc > .sync-artifacts/conflict.diff || true
            mapfile -t conflict_paths < .sync-artifacts/conflicts.txt
            echo "===== FORK LOCAL DIFF (baseline -> fork) ====="
            git diff --no-color --unified=8 "$BASELINE" "$PREMERGE" -- "${conflict_paths[@]}" || true
            echo "===== UPSTREAM DIFF (baseline -> target) ====="
            git diff --no-color --unified=8 "$BASELINE" "$TARGET" -- "${conflict_paths[@]}" || true
            echo "registered fork overlay has semantic conflicts; running upstream-first resolver"
            TARGET="$TARGET" ruby .sync-artifacts/resolve-upstream-sync-conflicts.rb
            git diff --name-only --diff-filter=U | tee .sync-artifacts/conflicts-after-resolver.txt
            if [ -s .sync-artifacts/conflicts-after-resolver.txt ]; then
              echo "resolver left semantic conflicts"
              exit "$status"
            fi
          fi

          TARGET="$TARGET" ruby -ryaml -e '
            path = ".fork/upstream.yml"
            data = YAML.safe_load(File.read(path))
            data["last_merged_upstream_sha"] = ENV.fetch("TARGET")
            File.write(path, YAML.dump(data))
          '
          git add .fork/upstream.yml

          test -n "$(git rev-parse -q --verify MERGE_HEAD)"
          git commit -m "Merge upstream/main into private fork [upstream-sync-bot]"

      - name: Validate fork governance
        shell: bash
        run: |
          set -euo pipefail
          CHECK_BASE="$TARGET" just fork-gate

      - name: Push resolved merge
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-diagnostics
          path: .sync-artifacts/
          if-no-files-found: ignore
