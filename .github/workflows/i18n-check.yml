name: i18n Health Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/i18n-check.yml"
      - "apps/web/**"
      - "apps/web/vite.base.ts"
      - "packages/fork/i18n/**"
      - ".github/workflows/upstream-sync-test-group.yml"
      - "bun.lock"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/i18n-check.yml"
      - "apps/web/**"
      - "apps/web/vite.base.ts"
      - "packages/fork/i18n/**"
      - ".github/workflows/upstream-sync-test-group.yml"
      - "bun.lock"
      - "package.json"

jobs:
  i18n-check:
    name: i18n Infrastructure & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify zh-CN dictionary JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('packages/fork/i18n/locales/zh-CN.json', 'utf8'))"
          echo "✅ zh-CN.json is valid JSON"

      - name: Run i18n runtime test suite
        run: bun test packages/fork/i18n

      - name: Typecheck i18n package
        run: bun x tsc -p packages/fork/i18n/tsconfig.json --noEmit

      - name: Run AST extraction & enforce i18n gate
        run: |
          bun packages/fork/i18n/extract.ts
          node -e '
            const fs = require("fs");
            const parseFailuresPath = "packages/fork/i18n/diff/parse-failures.json";
            const missingDetailsPath = "packages/fork/i18n/diff/missing-details.json";
            const failures = fs.existsSync(parseFailuresPath)
              ? JSON.parse(fs.readFileSync(parseFailuresPath, "utf8"))
              : [];
            const details = fs.existsSync(missingDetailsPath)
              ? JSON.parse(fs.readFileSync(missingDetailsPath, "utf8"))
              : {};
            const explicitMissing = Object.entries(details).filter(([, meta]) => meta.isExplicit);
            if (failures.length > 0) {
              console.error("❌ Blocking Failure: " + failures.length + " source files failed AST parsing!");
              console.error(JSON.stringify(failures, null, 2));
              process.exit(1);
            }
            if (explicitMissing.length > 0) {
              console.error("❌ Blocking Failure: " + explicitMissing.length + " explicit t()/__t() keys are missing from zh-CN.json!");
              console.error(JSON.stringify(Object.fromEntries(explicitMissing), null, 2));
              process.exit(1);
            }
            console.log("✅ Zero AST parse failures detected across all scanned files.");
            console.log("✅ All explicit t()/__t() keys are translated in zh-CN.json.");
          '

      - name: Run untranslated UI audit
        run: bun packages/fork/i18n/audit.ts

      - name: Upload i18n diff artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: i18n-diff-reports
          path: packages/fork/i18n/diff/
          retention-days: 14

      - name: Generate i18n Status Report
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            try {
              const missing = fs.existsSync("packages/fork/i18n/diff/missing.json") ? JSON.parse(fs.readFileSync("packages/fork/i18n/diff/missing.json", "utf8")) : {};
              const details = fs.existsSync("packages/fork/i18n/diff/missing-details.json") ? JSON.parse(fs.readFileSync("packages/fork/i18n/diff/missing-details.json", "utf8")) : {};
              const obsolete = fs.existsSync("packages/fork/i18n/diff/obsolete.json") ? JSON.parse(fs.readFileSync("packages/fork/i18n/diff/obsolete.json", "utf8")) : {};
              const ambiguous = fs.existsSync("packages/fork/i18n/diff/ambiguous.json") ? JSON.parse(fs.readFileSync("packages/fork/i18n/diff/ambiguous.json", "utf8")) : {};
              const dict = fs.existsSync("packages/fork/i18n/locales/zh-CN.json") ? JSON.parse(fs.readFileSync("packages/fork/i18n/locales/zh-CN.json", "utf8")) : {};

              const explicitList = [];
              const uiList = [];
              for (const [key, meta] of Object.entries(details)) {
                if (meta.isExplicit) {
                  explicitList.push({ key, ...meta });
                } else {
                  uiList.push({ key, ...meta });
                }
              }

              const missingCount = Object.keys(missing).length;
              const explicitCount = explicitList.length;
              const uiCount = uiList.length;
              const obsoleteCount = Object.keys(obsolete).length;
              const ambiguousCount = Object.keys(ambiguous).length;
              const translatedCount = Object.keys(dict).length;

              let summary = "## 🌐 i18n Infrastructure & Quality Report\n\n";
              summary += "| Metric | Count | Status |\n";
              summary += "| :--- | :--- | :--- |\n";
              summary += `| 📖 Translated Dictionary Entries (\`zh-CN.json\`) | **${translatedCount}** | ✅ Healthy |\n`;
              summary += `| 🚨 Missing Explicit \`t()\` Translations | **${explicitCount}** | ${explicitCount > 0 ? "⚠️ Needs Dictionary Update" : "✅ All Translated"} |\n`;
              summary += `| 📝 Untranslated UI Literals & Attributes | **${uiCount}** | ℹ️ Advisory |\n`;
              summary += `| 📦 Total Missing Translations | **${missingCount}** | ℹ️ |\n`;
              summary += `| 🧹 Obsolete Keys in \`zh-CN.json\` | **${obsoleteCount}** | ℹ️ |\n`;
              summary += `| 🔀 Ambiguous Context Keys | **${ambiguousCount}** | ℹ️ |\n`;
              summary += `| 🛡️ AST Parse Failures | **0** | ✅ Clean |\n\n`;

              if (explicitCount > 0) {
                summary += `### 🚨 Missing Explicit \`t()\` Translations (${explicitCount})\n`;
                summary += `> High Priority: These keys are invoked via \`t()\` or \`__t()\` in frontend code, but missing from \`zh-CN.json\`.\n\n`;
                summary += "| Missing Key | Code Location(s) |\n";
                summary += "| :--- | :--- |\n";
                for (const item of explicitList) {
                  const locs = item.locs.map(l => `\`apps/web/src/${l.file}:${l.line}\``).join("<br>");
                  const safeKey = item.key.replace(/\|/g, "\\|").replace(/</g, "&lt;");
                  summary += `| \`${safeKey}\` | ${locs} |\n`;
                }
                summary += "\n";
              }

              if (uiCount > 0) {
                const byFile = {};
                for (const item of uiList) {
                  for (const loc of item.locs) {
                    if (!byFile[loc.file]) byFile[loc.file] = [];
                    byFile[loc.file].push({ line: loc.line, type: loc.type, key: item.key });
                  }
                }
                const affectedFiles = Object.keys(byFile);

                summary += `<details>\n`;
                summary += `<summary><b>⚠️ Untranslated UI Literals & Attributes (${uiCount} keys across ${affectedFiles.length} files) - Click to Expand</b></summary>\n\n`;
                summary += `> These strings appear in JSX text, translatable attributes (placeholder, label, etc.), toasts, or template literals but have not yet been translated in \`zh-CN.json\`:\n\n`;

                const displayFiles = affectedFiles.slice(0, 50);
                for (const file of displayFiles) {
                  const items = byFile[file];
                  summary += `#### 📁 \`apps/web/src/${file}\` (${items.length} items)\n`;
                  for (const item of items.slice(0, 10)) {
                    const safeKey = item.key.replace(/`/g, "\\`").replace(/</g, "&lt;").slice(0, 120);
                    summary += `- Line ${item.line} \`[${item.type}]\`: \`${safeKey}\`\n`;
                  }
                  if (items.length > 10) {
                    summary += `- ... and ${items.length - 10} more items in this file\n`;
                  }
                  summary += "\n";
                }
                if (affectedFiles.length > 50) {
                  summary += `> ℹ️ Showing first 50 files. Download the workflow artifact **i18n-diff-reports** for complete file-by-file details.\n\n`;
                }
                summary += `</details>\n\n`;
              }

              if (obsoleteCount > 0) {
                summary += `<details>\n<summary><b>🧹 Obsolete Keys in \`zh-CN.json\` (${obsoleteCount}) - Click to Expand</b></summary>\n\n`;
                summary += "| English Key | Current Chinese Translation |\n| :--- | :--- |\n";
                for (const [k, v] of Object.entries(obsolete)) {
                  const safeK = k.replace(/\|/g, "\\|").replace(/</g, "&lt;");
                  const safeV = String(v).replace(/\|/g, "\\|").replace(/</g, "&lt;");
                  summary += `| \`${safeK}\` | ${safeV} |\n`;
                }
                summary += `</details>\n\n`;
              }

              if (process.env.GITHUB_STEP_SUMMARY) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
              }
              console.log(summary);
            } catch (e) {
              console.error("Failed to generate summary report:", e);
            }
          '
