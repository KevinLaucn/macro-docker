name: Nix S3 cache health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
      NIX_CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'

      - name: Validate configuration
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        shell: python
        run: |
          import os
          from urllib.parse import urlsplit, parse_qs
          required = ["NIX_CACHE_URL", "NIX_CACHE_PUBLIC_KEY",
                      "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY",
                      "NIX_CACHE_SIGNING_KEY"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("[失败] 缺少配置: " + ", ".join(missing))
          url = urlsplit(os.environ["NIX_CACHE_URL"])
          query = parse_qs(url.query)
          if (url.scheme != "s3" or not url.netloc
              or url.path not in ("", "/") or set(query) - {"region"}):
              raise SystemExit("[失败] 仅支持 s3://bucket?region=... 的 AWS S3 地址")
          region = query.get("region", ["us-east-1"])[0]
          import re
          if not re.fullmatch(r"[a-z0-9.-]+", url.netloc) or not re.fullmatch(r"[a-z0-9-]+", region):
              raise SystemExit("[失败] bucket 或 region 格式无效")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CACHE_BUCKET={url.netloc}\nAWS_DEFAULT_REGION={region}\n")
          print("[通过] 读写缓存所需配置齐全，不输出凭据")

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          nix-cache-url: ${{ vars.NIX_CACHE_URL }}
          nix-cache-public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          fail-on-cache-error: 'true'

      - name: Build random artifact, upload and download
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          report() {
            echo "$1"
            printf -- '- %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          probe_dir=$(mktemp -d "$RUNNER_TEMP/nix-cache-probe.XXXXXX")
          key_file="$probe_dir/signing-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$NIX_CACHE_SIGNING_KEY" > "$key_file"
          unset NIX_CACHE_SIGNING_KEY
          nonce=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          export CACHE_PROBE_NONCE="$nonce"
          printf '%s\n' "$nonce" > "$probe_dir/expected"

          # A real input-addressed derivation; only its tiny output is uploaded.
          # Use nixpkgs pinned by this repository instead of a moving channel.
          cat > "$probe_dir/probe.nix" <<'NIX'
          let
            repo = builtins.getFlake (builtins.getEnv "GITHUB_WORKSPACE");
            pkgs = import repo.inputs.nixpkgs { system = builtins.currentSystem; };
            nonce = builtins.getEnv "CACHE_PROBE_NONCE";
          in pkgs.runCommand "nix-cache-health-probe" {
            inherit nonce;
            allowSubstitutes = false;
            preferLocalBuild = true;
          } ''
            printf '%s\n' "$nonce" > "$out"
          ''
          NIX

          report '[构建] 创建随机 Nix 测试产物'
          path=$(nix build --impure --file "$probe_dir/probe.nix"             --no-link --print-out-paths --print-build-logs)
          cmp "$probe_dir/expected" "$path"
          test -z "$(nix-store --query --references "$path")"
          report "[通过] 构建成功，无运行时依赖：$path"

          nix store sign --key-file "$key_file" "$path"
          report '[上传] 将签名后的测试产物写入 S3'
          nix copy --to "$NIX_CACHE_URL" "$path"
          report '[通过] S3 上传完成'

          # Empty destination guarantees this is a download, not a local hit.
          download_root="$probe_dir/download"
          mkdir -p "$download_root"
          destination="local?root=$download_root"
          test ! -e "$download_root$path"
          report '[下载] 从 S3 恢复到全新的独立 Nix store'
          nix copy --from "$NIX_CACHE_URL" --to "$destination"             --option require-sigs true             --option trusted-public-keys "$NIX_CACHE_PUBLIC_KEY" "$path"
          nix store verify --store "$destination"             --option trusted-public-keys "$NIX_CACHE_PUBLIC_KEY"             --sigs-needed 1 "$path"
          cmp "$probe_dir/expected" "$download_root$path"
          report '[通过] S3 下载、Nix 签名、NAR 完整性及随机内容比对全部通过'
          report '[说明] 小型测试缓存保留在 S3；此检查不验证生产构建上传队列或命中率'

      - name: Count all current S3 objects and bytes
        if: ${{ !cancelled() && env.CACHE_BUCKET != '' }}
        shell: python
        run: |
          import json
          import os
          import subprocess

          if not os.environ.get("AWS_SESSION_TOKEN"):
              os.environ.pop("AWS_SESSION_TOKEN", None)
          totals = {"全部对象": [0, 0], "缓存索引 narinfo": [0, 0],
                    "缓存归档 nar/": [0, 0], "其他对象": [0, 0]}
          token = None
          pages = 0
          while True:
              args = ["aws", "--cli-connect-timeout", "10",
                      "--cli-read-timeout", "30",
                      "s3api", "list-objects-v2",
                      "--bucket", os.environ["CACHE_BUCKET"],
                      "--max-keys", "1000", "--no-paginate", "--output", "json"]
              if token:
                  args.extend(["--continuation-token", token])
              page = json.loads(subprocess.check_output(args, text=True, timeout=90))
              for item in page.get("Contents", []):
                  key, size = item["Key"], item["Size"]
                  category = ("缓存索引 narinfo" if key.endswith(".narinfo") else
                              "缓存归档 nar/" if key.startswith("nar/") else "其他对象")
                  for name in ("全部对象", category):
                      totals[name][0] += 1
                      totals[name][1] += size
              pages += 1
              if pages % 25 == 0:
                  print(f"[统计] 已扫描 {pages} 页、{totals['全部对象'][0]} 个对象", flush=True)
              if not page.get("IsTruncated"):
                  break
              token = page.get("NextContinuationToken")
              if not token:
                  raise SystemExit("[失败] S3 分页缺少 continuation token")

          lines = ["", "| 类型 | 文件数 | 大小 | 字节数 |",
                   "| --- | ---: | ---: | ---: |"]
          for name, (count, size) in totals.items():
              readable = f"{size / 1024**3:.3f} GiB"
              print(f"[统计] {name}: {count:,} 个，{readable}，{size:,} bytes")
              lines.append(f"| {name} | {count:,} | {readable} | {size:,} |")
          lines.append("\n统计全部分页的当前对象，包含本次测试缓存；"
                       "不含历史版本与未完成分段上传。并发上传时并非原子快照。")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")

      - name: Report failure
        if: failure()
        run: |
          echo '[失败] 健康检查未全部通过，请查看对应失败步骤'
          echo '- [失败] 健康检查未全部通过。' >> "$GITHUB_STEP_SUMMARY"
