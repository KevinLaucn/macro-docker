name: Upstream Sync Test Group

on:
  workflow_call:
    inputs:
      group:
        description: Validated customization test group
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reject unknown test group
        if: ${{ !contains(fromJSON('["conventions","workflow-lint","selfhost-config","email-rust","auth-rust","i18n","web","email-translation"]'), inputs.group) }}
        run: |
          echo "Unknown upstream-sync test group: ${{ inputs.group }}"
          exit 1

      - name: Set up Nix
        if: inputs.group != 'i18n' && inputs.group != 'workflow-lint'
        uses: ./.github/actions/setup-nix

      - name: Run conventions
        if: inputs.group == 'conventions'
        run: nix develop --command just check

      - name: Lint workflows
        if: inputs.group == 'workflow-lint'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate self-host artifacts
        if: inputs.group == 'selfhost-config'
        run: nix develop --command just self-host-check

      - name: Check email Rust crates
        if: inputs.group == 'email-rust'
        run: nix develop --command cargo check -p email_service -p email_db_client

      - name: Check authentication Rust crates
        if: inputs.group == 'auth-rust'
        run: nix develop --command cargo check -p authentication_service -p authentication_service_client

      - name: Set up Bun
        if: inputs.group == 'i18n' || inputs.group == 'web' || inputs.group == 'email-translation'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install web dependencies
        if: inputs.group == 'i18n' || inputs.group == 'web' || inputs.group == 'email-translation'
        run: bun install --frozen-lockfile

      - name: Test i18n
        if: inputs.group == 'i18n'
        run: bun test packages/fork/i18n

      - name: Test affected web feature
        if: inputs.group == 'web'
        run: bun test apps/web/src/components/app/split-layout/tests

      - name: Test fork read receipts
        if: inputs.group == 'web'
        run: bunx vitest run --config vitest.config.ts --project fork-read-receipts
        working-directory: apps/web

      - name: Test isolated email translation package
        if: inputs.group == 'email-translation'
        run: bun run --cwd packages/fork/email-translation test

      - name: Typecheck isolated email translation package
        if: inputs.group == 'email-translation'
        run: bun x tsc -p packages/fork/email-translation/tsconfig.json --noEmit

      - name: Typecheck i18n package
        if: inputs.group == 'i18n'
        run: bun x tsc -p packages/fork/i18n/tsconfig.json --noEmit

      - name: Run AST extraction & enforce i18n gate
        if: inputs.group == 'i18n'
        run: |
          bun packages/fork/i18n/extract.ts
          node -e '
            const fs = require("fs");
            const failures = fs.existsSync("packages/fork/i18n/diff/parse-failures.json")
              ? JSON.parse(fs.readFileSync("packages/fork/i18n/diff/parse-failures.json", "utf8"))
              : [];
            const details = fs.existsSync("packages/fork/i18n/diff/missing-details.json")
              ? JSON.parse(fs.readFileSync("packages/fork/i18n/diff/missing-details.json", "utf8"))
              : {};
            const explicitMissing = Object.entries(details).filter(([, meta]) => meta.isExplicit);
            if (failures.length > 0) {
              console.error("Blocking failure: " + failures.length + " source files failed AST parsing.");
              console.error(JSON.stringify(failures, null, 2));
              process.exit(1);
            }
            if (explicitMissing.length > 0) {
              console.error("Blocking failure: " + explicitMissing.length + " explicit t()/__t() keys are missing from zh-CN.json.");
              console.error(JSON.stringify(Object.fromEntries(explicitMissing), null, 2));
              process.exit(1);
            }
          '

      - name: Run untranslated UI audit
        if: inputs.group == 'i18n'
        run: bun packages/fork/i18n/audit.ts
