name: Setup Rust

description: Installs Rust and configures cargo/sccache caching.

inputs:
  sccache:
    description: Configure sccache as RUSTC_WRAPPER
    required: false
    default: 'true'
  rust-cache:
    description: Restore Swatinem/rust-cache Cargo target cache
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: setup rust toolchain
      shell: bash
      run: |
        set -euo pipefail

        # Namespace runners do not always include Rust; rustup installs into
        # ~/.cargo/bin, which also needs to be visible to later steps.
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

        if ! command -v rustup >/dev/null 2>&1; then
          rustup_script="$(mktemp)"
          trap 'rm -f "$rustup_script"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --http1.1 --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              --proto '=https' --tlsv1.2 -sSf -L https://sh.rustup.rs -o "$rustup_script"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Unable to download rustup installer after $attempt attempts"
              exit 1
            fi
            echo "rustup download failed (attempt $attempt/5); retrying in 10s..."
            sleep 10
          done
          sh "$rustup_script" -y --profile minimal
        fi

        if [[ -f rust-toolchain.toml ]]; then
          toolchain="$(grep -E '^[[:space:]]*channel[[:space:]]*=' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')"
        else
          toolchain="stable"
        fi

        if ! rustup run "$toolchain" rustc --version >/dev/null 2>&1; then
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
        else
          echo "Rust toolchain $toolchain already installed: $(rustup run "$toolchain" rustc --version)"
          installed_components="$(rustup component list --toolchain "$toolchain" --installed)"
          if ! grep -q '^clippy-' <<<"$installed_components"; then
            rustup component add --toolchain "$toolchain" clippy
          fi
          if ! grep -q '^rustfmt-' <<<"$installed_components"; then
            rustup component add --toolchain "$toolchain" rustfmt
          fi
        fi

        rustup default "$toolchain"
    - name: setup sccache
      if: ${{ inputs.sccache == 'true' }}
      uses: ./.github/actions/setup-sccache
    - name: setup rust caching
      if: ${{ inputs.rust-cache == 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: cloud-storage
        cache-all-crates: true
        workspaces: "."
