[package]
description = "xtask slim-plan: analyze marginal removable closures and top-heavy dependencies for cargo decoupling"
edition = "2024"
name = "xtask_slim_plan"
publish = false
version = "0.1.0"

[[bin]]
name = "xtask_slim_plan"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
guppy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
xtask_graph = { path = "../xtask_graph" }
